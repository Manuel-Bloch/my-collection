<!DOCTYPE html>
<html lang="de">
<head>
    <link rel="stylesheet" href="../css/style.css">
    <script src="./js/app.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Tennis Tracker</title>
</head>
<body>
    <header>
        <p>TTT</p>
    
    <nav>
        <a href="../index.html">Startseite</a>
        
        <a href="./add_entry.html">Spiel hinzufügen</a>
        
        <a href="./game_entry.html">Spiel anzeigen</a>

        <a href="./statistics.html">Statistik</a>
        
        <a href="./kontaktformular.html">Kontaktformular</a>
               
    </nav>
    </header>

    <main>
        <h1>Neuer Eintrag</h1>

        <section>
            <form class="form-card" action="#" method="post">
                <label for="opponent_name">Name des Gegners:</label>
                <input type="text" id="opponent_name" name="opponent_name" required>
                <label for="date">Datum:</label>
                <input type="date" id="date" name="date" required>
                <label for="setscore">Satzergebnisse:</label>
                <input type="number" id="setscore" name="setscore" required>
                <label for="score">Ergebnis:</label>
                <input type="number" id="score" name="score" required>
                <label for="note_positive">Was hat gut funktioniert:</label>
                <textarea id="note_positive" name="note_positive" rows="3"></textarea>
                <label for="note_negative">Was hat nicht gut funktioniert:</label>
                <textarea id="note_negative" name="note_negative" rows="3"></textarea>
                <button type="submit">Eintrag hinzufügen</button>
            </form>
        </section>

    </main>
</body>
</html>
