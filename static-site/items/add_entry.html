<!DOCTYPE html>
<html lang="de">
<head>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/app.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Tennis Tracker</title>
</head>
<body class="app-shell">
    <header class="site-header">
        <a class="brand" href="../index.html" aria-label="Matchpoint Startseite">
            <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
                <ellipse cx="17" cy="17" rx="11" ry="13" fill="currentColor"/>
                <path d="m24 26 13 13 4-4-13-13" fill="currentColor"/>
                <circle class="brand-ball" cx="37" cy="10" r="3.5" fill="var(--color-accent-hover)"/>
            </svg>
            <span class="brand-copy">
                <span class="brand-name">MATCHPOINT</span>
                <span class="brand-label">Table Tennis</span>
            </span>
        </a>

    <nav aria-label="Hauptnavigation">
        <a href="../index.html">Startseite</a>
        <a href="./statistics.html">Statistik</a>
        <a href="./kontaktformular.html">Kontaktformular</a>
               
    </nav>
    </header>

    <main class="content-main new-entry-page">
        <section class="page-heading">
            <div>
                <p class="eyebrow">Neuer Matchbericht</p>
                <h1>Spiel hinzufügen</h1>
            </div>
            <a class="back-link" href="../index.html">Zurück zur Übersicht</a>
        </section>

        <section class="form-layout" aria-label="Neuen Spieleintrag erfassen">
            <form class="form-card" action="#" method="post">
                <div class="form-grid">
                    <div class="field">
                        <label for="opponent_name">Name des Gegners</label>
                        <input type="text" id="opponent_name" name="opponent_name" required>
                    </div>
                    <div class="field">
                        <label for="date">Datum</label>
                        <input type="date" id="date" name="date" required>
                    </div>
                    <div class="field">
                        <label for="setscore">Satzergebnisse</label>
                        <input type="text" id="setscore" name="setscore" placeholder="11:8, 9:11, 11:7" required>
                    </div>
                    <div class="field">
                        <label for="score">Gesamtergebnis</label>
                        <input type="text" id="score" name="score" placeholder="3:1" required>
                    </div>
                    <div class="field field-full">
                        <label for="note_positive">Was hat gut funktioniert?</label>
                        <textarea id="note_positive" name="note_positive" rows="4"></textarea>
                    </div>
                    <div class="field field-full">
                        <label for="note_negative">Was hat nicht gut funktioniert?</label>
                        <textarea id="note_negative" name="note_negative" rows="4"></textarea>
                    </div>
                </div>
                <button type="submit" class="primary-button">Eintrag hinzufügen</button>
            </form>
        </section>

    </main>
</body>
</html>
