<!DOCTYPE html>
<html lang="de">
<head>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/app.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Tennis Tracker</title>
</head>
<body class="app-shell">
    <header class="site-header">
        <a class="brand" href="../index.html" aria-label="Matchpoint Startseite">
            <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
                <path d="m19 22 14 14 6-6-14-14" fill="currentColor"/>
                <ellipse cx="17" cy="17" rx="11" ry="13" fill="currentColor"/>
                <circle class="brand-ball" cx="37" cy="10" r="3.5" fill="var(--color-accent-hover)"/>
            </svg>
            <span class="brand-copy">
                <span class="brand-name">MATCHPOINT</span>
                <span class="brand-label">Table Tennis</span>
            </span>
        </a>

    <nav aria-label="Hauptnavigation">
        <a href="../index.html">Startseite</a>
        <a href="./statistics.html" aria-current="page">Statistik</a>
        <a href="./kontaktformular.html">Kontaktformular</a>
               
    </nav>
    </header>
    
    <main class="content-main statistics-page">
        <section class="page-heading">
            <div>
                <p class="eyebrow">Leistungsübersicht</p>
                <h1>Statistik</h1>
            </div>
        </section>

        <section class="panel">
            <h2>Gesamtübersicht</h2>
            <dl class="stats">
                <div class="stat">
                    <dt>Absolvierte Spiele</dt>
                    <dd>24</dd>
                </div>
                <div class="stat">
                    <dt>Gewonnen</dt>
                    <dd class="win">15</dd>
                </div>
                <div class="stat">
                    <dt>Verloren</dt>
                    <dd class="loss">9</dd>
                </div>
                <div class="stat">
                    <dt>Gewinnrate</dt>
                    <dd>62,5%</dd>
                </div>
            </dl>
        </section>

        <section class="panel">
            <h2>Spiele nach Kategorie</h2>
            <div class="table-wrap">
            <table class="stats-table">
                <thead>
                    <tr>
                        <th scope="col">Kategorie</th>
                        <th scope="col">Spiele</th>
                        <th scope="col">Gewonnen</th>
                        <th scope="col">Verloren</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th scope="row">Training</th>
                        <td>12</td>
                        <td>8</td>
                        <td>4</td>
                    </tr>
                    <tr>
                        <th scope="row">Turnier</th>
                        <td>7</td>
                        <td>4</td>
                        <td>3</td>
                    </tr>
                    <tr>
                        <th scope="row">Liga</th>
                        <td>5</td>
                        <td>3</td>
                        <td>2</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <th scope="row">Gesamt</th>
                        <td>24</td>
                        <td>15</td>
                        <td>9</td>
                    </tr>
                </tfoot>
            </table>
            </div>
        </section>
    </main>
</body>
</html>
