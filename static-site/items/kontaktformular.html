<!DOCTYPE html>
<html lang="de">
<head>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/app.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Tennis Tracker</title>
</head>

<body class="app-shell">
    <header class="site-header">
        <a class="brand" href="../index.html" aria-label="Matchpoint Startseite">
            <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
                <ellipse cx="17" cy="17" rx="11" ry="13" fill="currentColor"/>
                <path d="m24 26 13 13 4-4-13-13" fill="currentColor"/>
                <circle class="brand-ball" cx="37" cy="10" r="3.5" fill="var(--color-accent-hover)"/>
            </svg>
            <span class="brand-copy">
                <span class="brand-name">MATCHPOINT</span>
                <span class="brand-label">Table Tennis</span>
            </span>
        </a>

    <nav aria-label="Hauptnavigation">
        <a href="../index.html">Startseite</a>
        <a href="./statistics.html">Statistik</a>
        <a href="./kontaktformular.html" aria-current="page">Kontaktformular</a>
    </nav>
    </header>

    <main class="content-main contact-page">
        <section class="page-heading">
            <div>
                <p class="eyebrow">Nachricht senden</p>
                <h1>Kontaktformular</h1>
            </div>
        </section>
        <section class="form-layout" aria-label="Kontaktdaten und Nachricht">
            <form class="form-card" action="#" method="post">
                <div class="form-grid contact-grid">
                    <div class="field">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="field">
                        <label for="email">E-Mail</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="field field-full">
                        <label for="message">Nachricht</label>
                        <textarea id="message" name="message" rows="6" required></textarea>
                    </div>
                </div>
                <button type="submit" class="primary-button">Absenden</button>
            </form>
        </section>

    </main>
</body>
</html>
